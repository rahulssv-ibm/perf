name: Get Env

on:
  workflow_dispatch:

jobs:
  generate-logs:
    name: Print Env - ${{ matrix.os }} [${{ matrix.runner_owner }}]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # - os: self-hosted
          #   runner_owner: "github-hosted"
          # - os: ubuntu-26.04-ppc64le-vm
          #   runner_owner: "actions-runner-ppc64le"
          # - os: ubuntu-22.04-ppc64le
          #   runner_owner: "actions-runner-ppc64le"
          - os: ubuntu-24.04-ppc64le
            runner_owner: "actions-runner-ppc64le"
          - os: ubuntu-22.04-ppc64le
            runner_owner: "actions-runner-ppc64le"
          # - os: ubuntu-24.04-ppc64le-vm
          #   runner_owner: "actions-runner-ppc64le"
          - os: ubuntu-24.04-s390x
            runner_owner: "actions-runner-s390x"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Hold runner for 3 minutes
        run: |
          echo "Starting 3-minute timer..."
          sleep 5
          php --version
          sh -lc \
            "dpkg-query -W -f='\${db:Status-Abbrev} \${binary:Package} \${Version}\n' 'php*' 2>/dev/null | awk '\$1 ~ /^ii/'"
          echo "3 minutes complete!"
